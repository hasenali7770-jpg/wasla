# Local development dependencies. Start with: make dev-up
# Production does NOT use this file: see docs/01-architecture.md §9.
name: wasla-dev
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: wasla
      POSTGRES_PASSWORD: wasla-dev-only
      POSTGRES_DB: wasla
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wasla"]
      interval: 5s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["6379:6379"]

  # S3-compatible storage for local dev only. MinIO's community edition no
  # longer ships new images, so this tag is pinned; production uses managed
  # S3-compatible storage (see docs/04-decisions.md, ADR-008).
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: wasla
      MINIO_ROOT_PASSWORD: wasla-dev-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
