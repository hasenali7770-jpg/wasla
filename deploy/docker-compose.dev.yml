# Local development dependencies. Start with: make dev-up
# Production does NOT use this file: see docs/01-architecture.md §9.
name: wasla-dev
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: wasla
      POSTGRES_PASSWORD: wasla-dev-only
      POSTGRES_DB: wasla
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wasla"]
      interval: 5s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["6379:6379"]

  # S3-compatible storage (SeaweedFS; MinIO no longer publishes community
  # images, see ADR-008). Server env: WASLA_S3_ENDPOINT=localhost:8333
  # WASLA_S3_ACCESS_KEY=wasla WASLA_S3_SECRET_KEY=wasla-dev-only
  s3:
    image: chrislusf/seaweedfs:3.97
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"wasla","credentials":[{"accessKey":"wasla","secretKey":"wasla-dev-only"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    ports: ["8333:8333"]
    volumes: [s3data:/data]

volumes:
  pgdata:
  s3data:
