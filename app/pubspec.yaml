name: wasla
description: "Wasla (وصلة) — cloud messaging app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

# All dependencies are permissively licensed (ADR-009). Versions are pinned
# exactly; upgrades go through a reviewed pull request.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: 3.4.3
  go_router: 18.1.2
  protobuf: 6.1.0
  fixnum: 1.1.1
  web_socket_channel: 3.0.3
  flutter_secure_storage: 11.2.0
  phone_numbers_parser: 9.0.29
  sqlite3: 3.8.0
  path_provider: 2.1.6
  image_picker: 1.2.4
  file_picker: 13.3.2
  image: 4.12.0
  http: 1.6.0
  open_filex: 5.0.0
  firebase_core: 5.2.0
  firebase_messaging: 17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4

# App icons from the brand kit (app/assets/brand/README.md).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/wasla-icon-1024.png"
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/brand/android-adaptive-foreground-432.png"
  adaptive_icon_monochrome: "assets/brand/android-monochrome-432.png"
  web:
    generate: true
    image_path: "assets/brand/wasla-icon-512.png"
    background_color: "#111111"
    theme_color: "#0F6E35"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/wasla-icon-rounded-1024.png
  # Cairo (SIL OFL 1.1, assets/fonts/OFL-Cairo.txt), the brand font (brand kit v2).
  # Bundled so Arabic renders correctly offline and on every platform.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo_400Regular.ttf
        - asset: assets/fonts/Cairo_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo_800ExtraBold.ttf
          weight: 800
