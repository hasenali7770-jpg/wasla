name: wasla
description: "Wasla (وصلة) — cloud messaging app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

# All dependencies are permissively licensed (ADR-009). Versions are pinned
# exactly; upgrades go through a reviewed pull request.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: 3.4.3
  go_router: 18.1.2
  protobuf: 6.1.0
  fixnum: 1.1.1
  web_socket_channel: 3.0.3
  flutter_secure_storage: 11.2.0
  phone_numbers_parser: 9.0.29

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
  # IBM Plex Sans Arabic (SIL OFL 1.1, assets/fonts/OFL-IBMPlexSansArabic.txt).
  # Bundled so Arabic renders correctly offline and on every platform.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
