syntax = "proto3";

package wasla.v1;

import "wasla/v1/users.proto";

// ContactsService: phone-book sync.
//
// Anti-abuse: ImportContacts is the main phone-number enumeration vector.
// The server caps imports per account per day and the total number of
// distinct numbers an account may ever look up; see docs/01-architecture.md §8.
service ContactsService {
  rpc ImportContacts(ImportContactsRequest) returns (ImportContactsResponse);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  rpc DeleteContacts(DeleteContactsRequest) returns (DeleteContactsResponse);
}

message InputContact {
  // Client-side identifier, echoed back so results can be matched.
  int64 client_id = 1;
  // Normalised to E.164 by the client (libphonenumber, default region IQ).
  string phone = 2;
  string first_name = 3;
  string last_name = 4;
}

message ImportedContact {
  int64 client_id = 1;
  int64 user_id = 2;
}

message ImportContactsRequest {
  // At most 500 per call.
  repeated InputContact contacts = 1;
}

message ImportContactsResponse {
  repeated ImportedContact imported = 1;
  repeated User users = 2;
  // client_ids skipped because of a rate limit; retry later.
  repeated int64 retry_client_ids = 3;
}

message ListContactsRequest {
  // Hash of the client's current contact user_ids; when it matches, the
  // server answers not_modified and sends nothing else.
  int64 hash = 1;
}

message ListContactsResponse {
  bool not_modified = 1;
  repeated User users = 2;
  int64 hash = 3;
}

message DeleteContactsRequest {
  repeated int64 user_ids = 1;
}

message DeleteContactsResponse {}
