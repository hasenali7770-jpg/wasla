version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: wasla/backend/gen/proto
plugins:
  # Go messages + Connect handlers (Connect is the HTTP fallback transport).
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: ../backend/gen/proto
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.18.1
    out: ../backend/gen/proto
    opt: paths=source_relative
  # Dart messages for the Flutter client.
  - remote: buf.build/protocolbuffers/dart:v22.1.0
    out: ../app/lib/gen/proto
